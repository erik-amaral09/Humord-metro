<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Humordômetro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff6fa;
    --surface:#ffffff;
    --surface-2:#ffe9f2;
    --primary:#e23f73;
    --primary-ink:#ffffff;
    --secondary:#9b6bff;
    --text:#3b1f30;
    --muted:#8c7086;
    --border:#f3d3e0;
    --shadow:0 10px 30px -12px rgba(226,63,115,0.28);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1017; --surface:#2a1620; --surface-2:#3a1e2c;
      --primary:#ff6fa0; --primary-ink:#2a0d18; --secondary:#b78cff;
      --text:#fce9f1; --muted:#c99db4; --border:#4a2436;
      --shadow:0 10px 30px -12px rgba(0,0,0,0.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1017; --surface:#2a1620; --surface-2:#3a1e2c;
    --primary:#ff6fa0; --primary-ink:#2a0d18; --secondary:#b78cff;
    --text:#fce9f1; --muted:#c99db4; --border:#4a2436;
    --shadow:0 10px 30px -12px rgba(0,0,0,0.55);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',system-ui,sans-serif;
    padding-inline:16px;
    padding-block:28px;
    padding-top:calc(28px + env(safe-area-inset-top,0px));
    padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  img{ max-width:100%; }
  #app{ width:100%; max-width:440px; display:flex; flex-direction:column; gap:18px; }
  h1,h2,.display{ font-family:'Fredoka',system-ui,sans-serif; text-wrap:balance; margin:0; }
  .header{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .header h1{ font-size:1.7rem; font-weight:600; color:var(--primary); }
  .header .sub{ margin-top:2px; color:var(--muted); font-size:0.92rem; font-weight:600; }
  .link-btn{ background:none; border:none; color:var(--muted); font-family:inherit; font-size:0.85rem; font-weight:700; text-decoration:underline; text-underline-offset:2px; cursor:pointer; padding:6px 2px; flex-shrink:0; }
  .link-btn:hover{ color:var(--primary); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:18px; box-shadow:var(--shadow); }
  .mood-card{ display:flex; align-items:center; gap:14px; text-align:left; width:100%; cursor:pointer; transition:transform .15s ease; }
  .mood-card.static{ cursor:default; }
  .mood-card:active{ transform:scale(0.98); }
  .mood-card .avatar{ width:76px; height:76px; border-radius:50%; object-fit:cover; flex-shrink:0; border:3px solid var(--surface-2); background:var(--surface-2); }
  .mood-card .avatar.empty{ display:flex; align-items:center; justify-content:center; font-size:1.8rem; }
  .mood-card .info{ min-width:0; flex:1; }
  .mood-card .who{ font-size:0.78rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .mood-card .mood-label{ font-family:'Fredoka',system-ui,sans-serif; font-size:1.25rem; font-weight:600; margin-top:2px; }
  .mood-card .note{ margin-top:4px; font-size:0.9rem; color:var(--muted); font-style:italic; overflow-wrap:anywhere; }
  .mood-card .when{ margin-top:6px; font-size:0.76rem; color:var(--muted); }
  .mood-card .cta{ margin-left:auto; color:var(--primary); font-size:1.3rem; flex-shrink:0; }
  .btn{ font-family:'Fredoka',system-ui,sans-serif; font-weight:600; font-size:1rem; border:none; border-radius:16px; padding:14px 18px; cursor:pointer; width:100%; }
  .btn-primary{ background:var(--primary); color:var(--primary-ink); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  label{ display:block; font-size:0.85rem; font-weight:700; color:var(--muted); margin-bottom:6px; }
  input[type=text], textarea{ width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:12px 14px; font-family:inherit; font-size:1rem; color:var(--text); resize:vertical; }
  input[type=text]:focus, textarea:focus{ outline:2px solid var(--primary); outline-offset:1px; }
  .field{ margin-bottom:16px; }
  .intro{ text-align:center; padding:8px 4px 0; }
  .intro .big-emoji{ font-size:2.6rem; }
  .intro p{ color:var(--muted); margin:8px 0 0; font-size:0.95rem; }
  .role-grid{ display:flex; flex-direction:column; gap:12px; }
  .role-btn{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px; font-family:'Fredoka',system-ui,sans-serif; font-size:1.1rem; font-weight:600; color:var(--text); cursor:pointer; box-shadow:var(--shadow); }
  .role-btn:active{ transform:scale(0.98); }
  .role-btn .dot{ width:14px;height:14px;border-radius:50%; background:var(--primary); flex-shrink:0; }
  .role-btn:nth-child(2) .dot{ background:var(--secondary); }
  .sheet-backdrop{ position:fixed; inset:0; background:rgba(20,8,14,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  .sheet{ background:var(--surface); width:100%; max-width:440px; border-radius:26px 26px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto; }
  .sheet-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .sheet-head h2{ font-size:1.2rem; color:var(--primary); }
  .close-x{ background:var(--surface-2); border:none; color:var(--text); width:32px;height:32px; border-radius:50%; font-size:1rem; cursor:pointer; }
  .mood-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  .mood-opt{ background:var(--surface-2); border:2px solid transparent; border-radius:16px; padding:10px 6px 12px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; text-align:center; }
  .mood-opt.selected{ border-color:var(--primary); background:var(--surface); }
  .mood-opt img{ width:64px;height:64px; border-radius:50%; object-fit:cover; }
  .mood-opt .lbl{ font-size:0.8rem; font-weight:700; line-height:1.15; }
  .mood-opt .sub{ font-size:0.68rem; color:var(--muted); line-height:1.1; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:0.88rem; font-weight:600; z-index:30; max-width:90vw; text-align:center; }
  .loading{ text-align:center; color:var(--muted); padding:40px 0; font-weight:700; }
  .config-error{ background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:20px; box-shadow:var(--shadow); }
  .config-error h2{ color:var(--primary); font-size:1.1rem; margin-bottom:8px; }
  .config-error p{ font-size:0.9rem; color:var(--muted); line-height:1.5; }
  .config-error code{ background:var(--surface-2); padding:2px 6px; border-radius:6px; font-size:0.85rem; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";

  /* =========================================================
     CONFIGURAÇÃO — troque as duas linhas abaixo pelos valores
     do SEU projeto Supabase (Settings > API no painel dele).
     ========================================================= */
  var SUPABASE_URL = "https://digifsphvqwtzhivmvaa.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_EQH8Lo9iXkQKVMg7g48ubA_kFPg5e6D";
  var TABLE = "casal_humor";
  /* ========================================================= */

  var MOODS = [
    { id:"feliz",  label:"Feliz",  sub:"faceirinho(a)",   img:"img/feliz.png"  },
    { id:"triste", label:"Triste", sub:"",                img:"img/triste.png" },
    { id:"bravo",  label:"Bravo(a)", sub:"",              img:"img/bravo.png"  },
    { id:"medo",   label:"Medo",   sub:"eita lasqueira",  img:"img/medo.png"   },
    { id:"fome",   label:"Fome",   sub:"",                img:"img/fome.png"   },
    { id:"sono",   label:"Sono",   sub:"",                img:"img/sono.png"   }
  ];
  var MOOD_BY_ID = {};
  MOODS.forEach(function(m){ MOOD_BY_ID[m.id] = m; });

  var ROLE_KEY = "hm_role_v1";
  function getRole(){ try { return localStorage.getItem(ROLE_KEY); } catch(e){ return null; } }
  function setRole(r){ try { localStorage.setItem(ROLE_KEY, r); } catch(e){} }
  function clearRole(){ try { localStorage.removeItem(ROLE_KEY); } catch(e){} }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function timeAgo(iso){
    if(!iso) return "";
    var then = new Date(iso).getTime();
    if(isNaN(then)) return "";
    var diffMs = Date.now() - then;
    var min = Math.floor(diffMs / 60000);
    if(min < 1) return "agora mesmo";
    if(min < 60) return "há " + min + " min";
    var h = Math.floor(min / 60);
    if(h < 24) return "há " + h + "h";
    var d = Math.floor(h / 24);
    return "há " + d + (d === 1 ? " dia" : " dias");
  }

  function toast(msg){
    var root = document.getElementById("toast-root");
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    root.innerHTML = "";
    root.appendChild(el);
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 3200);
  }

  var state = {
    profiles: { a:{name:""}, b:{name:""} },
    moods: { a:{moodId:null,note:"",updatedAt:null}, b:{moodId:null,note:"",updatedAt:null} }
  };
  var pendingMoodId = null;
  var sb = null;

  function rowsToState(rows){
    var next = {
      profiles: { a:{name:""}, b:{name:""} },
      moods: { a:{moodId:null,note:"",updatedAt:null}, b:{moodId:null,note:"",updatedAt:null} }
    };
    (rows || []).forEach(function(row){
      if(row.role !== "a" && row.role !== "b") return;
      next.profiles[row.role].name = row.name || "";
      next.moods[row.role] = {
        moodId: row.mood_id || null,
        note: row.note || "",
        updatedAt: row.updated_at || null
      };
    });
    return next;
  }

  async function loadState(){
    var res = await sb.from(TABLE).select("*");
    if(res.error) throw res.error;
    state = rowsToState(res.data);
  }

  async function upsertRole(role, patch){
    var current = {
      role: role,
      name: state.profiles[role].name,
      mood_id: state.moods[role].moodId,
      note: state.moods[role].note,
      updated_at: state.moods[role].updatedAt
    };
    var row = Object.assign(current, patch);
    var res = await sb.from(TABLE).upsert(row, { onConflict: "role" });
    if(res.error) throw res.error;
  }

  function otherRole(r){ return r === "a" ? "b" : "a"; }
  function nameFor(r){
    var n = state.profiles[r] && state.profiles[r].name;
    return n ? n : (r === "a" ? "Pessoa 1" : "Pessoa 2");
  }

  /* ---------------- screens ---------------- */

  function renderSetup(){
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="intro"><div class="big-emoji">🐒💗</div><h1>Humordômetro</h1><p>Antes de começar, como vocês se chamam?</p></div>' +
      '<div class="card">' +
        '<div class="field"><label for="hm-name-a">Seu nome</label><input type="text" id="hm-name-a" maxlength="30" placeholder="Ex: Erik"></div>' +
        '<div class="field"><label for="hm-name-b">Nome da outra pessoa</label><input type="text" id="hm-name-b" maxlength="30" placeholder="Ex: Nome dela/dele"></div>' +
        '<button class="btn btn-primary" id="hm-setup-go">Começar</button>' +
      '</div>';

    document.getElementById("hm-setup-go").addEventListener("click", async function(){
      var a = document.getElementById("hm-name-a").value.trim();
      var b = document.getElementById("hm-name-b").value.trim();
      if(!a || !b){ toast("Preenche os dois nomes pra continuar."); return; }
      try{
        await upsertRole("a", { name: a });
        await upsertRole("b", { name: b });
        state.profiles.a.name = a;
        state.profiles.b.name = b;
        render();
      }catch(e){ toast("Não deu pra salvar os nomes. Confere a configuração do Supabase."); }
    });
  }

  function renderRolePick(){
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="intro"><div class="big-emoji">🐒💗</div><h1>Humordômetro</h1><p>Toque em quem é você nesse aparelho.</p></div>' +
      '<div class="role-grid">' +
        '<button class="role-btn" data-role="a"><span class="dot"></span>' + escapeHtml(nameFor("a")) + '</button>' +
        '<button class="role-btn" data-role="b"><span class="dot"></span>' + escapeHtml(nameFor("b")) + '</button>' +
      '</div>';
    app.querySelectorAll(".role-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        setRole(btn.getAttribute("data-role"));
        render();
      });
    });
  }

  function moodCardHtml(role, isMine){
    var m = state.moods[role] || {};
    var mood = m.moodId ? MOOD_BY_ID[m.moodId] : null;
    var avatar = mood
      ? '<img class="avatar" src="' + mood.img + '" alt="' + escapeHtml(mood.label) + '">'
      : '<div class="avatar empty">🐒</div>';
    var label = mood ? mood.label : "Ainda sem humor registrado";
    var note = m.note ? '<div class="note">"' + escapeHtml(m.note) + '"</div>' : '';
    var when = m.updatedAt ? '<div class="when">' + timeAgo(m.updatedAt) + '</div>' : '';
    var who = isMine ? "Seu humor" : "Humor de " + escapeHtml(nameFor(role));
    var cta = isMine ? '<div class="cta">✏️</div>' : '';
    return (
      '<div class="mood-card ' + (isMine ? "" : "static") + '"' + (isMine ? ' id="hm-open-picker"' : '') + '>' +
        avatar +
        '<div class="info"><div class="who">' + who + '</div><div class="mood-label">' + escapeHtml(label) + '</div>' + note + when + '</div>' +
        cta +
      '</div>'
    );
  }

  function renderMain(){
    var role = getRole();
    var other = otherRole(role);
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="header"><div><h1>🐒 Humordômetro</h1><div class="sub">' + escapeHtml(nameFor("a")) + ' &amp; ' + escapeHtml(nameFor("b")) + '</div></div>' +
        '<button class="link-btn" id="hm-switch">trocar</button></div>' +
      '<div class="card">' + moodCardHtml(role, true) + '</div>' +
      '<div class="card">' + moodCardHtml(other, false) + '</div>';

    document.getElementById("hm-switch").addEventListener("click", function(){ clearRole(); render(); });
    var opener = document.getElementById("hm-open-picker");
    if(opener) opener.addEventListener("click", openPicker);
  }

  /* ---------------- mood picker sheet ---------------- */

  function openPicker(){
    var role = getRole();
    var current = state.moods[role] || {};
    pendingMoodId = current.moodId || null;

    var backdrop = document.createElement("div");
    backdrop.className = "sheet-backdrop";
    backdrop.id = "hm-backdrop";

    var optsHtml = MOODS.map(function(m){
      var sel = m.id === pendingMoodId ? " selected" : "";
      return (
        '<div class="mood-opt' + sel + '" data-mood="' + m.id + '">' +
          '<img src="' + m.img + '" alt="' + escapeHtml(m.label) + '">' +
          '<div class="lbl">' + escapeHtml(m.label) + '</div>' +
          (m.sub ? '<div class="sub">' + escapeHtml(m.sub) + '</div>' : '') +
        '</div>'
      );
    }).join("");

    backdrop.innerHTML =
      '<div class="sheet">' +
        '<div class="sheet-head"><h2>Como você tá?</h2><button class="close-x" id="hm-close">✕</button></div>' +
        '<div class="mood-grid">' + optsHtml + '</div>' +
        '<div class="field"><label for="hm-note">Motivo (opcional)</label>' +
          '<textarea id="hm-note" rows="2" maxlength="140" placeholder="Conta rapidinho o porquê...">' + escapeHtml(current.note || "") + '</textarea></div>' +
        '<button class="btn btn-primary" id="hm-confirm" disabled>Salvar humor</button>' +
      '</div>';

    document.body.appendChild(backdrop);
    var confirmBtn = document.getElementById("hm-confirm");
    confirmBtn.disabled = !pendingMoodId;

    backdrop.querySelectorAll(".mood-opt").forEach(function(opt){
      opt.addEventListener("click", function(){
        pendingMoodId = opt.getAttribute("data-mood");
        backdrop.querySelectorAll(".mood-opt").forEach(function(o){ o.classList.remove("selected"); });
        opt.classList.add("selected");
        confirmBtn.disabled = false;
      });
    });

    document.getElementById("hm-close").addEventListener("click", closePicker);
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) closePicker(); });

    confirmBtn.addEventListener("click", async function(){
      if(!pendingMoodId) return;
      var moodToSave = pendingMoodId;
      var note = document.getElementById("hm-note").value.trim();
      var role2 = getRole();
      var updatedAt = new Date().toISOString();
      closePicker();
      try{
        await upsertRole(role2, { mood_id: moodToSave, note: note, updated_at: updatedAt });
        state.moods[role2] = { moodId: moodToSave, note: note, updatedAt: updatedAt };
        render();
      }catch(e){ toast("Não deu pra salvar. Confere sua internet e tenta de novo."); }
    });
  }

  function closePicker(){
    var backdrop = document.getElementById("hm-backdrop");
    if(backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
    pendingMoodId = null;
  }

  /* ---------------- router ---------------- */

  function render(){
    var needsSetup = !state.profiles.a.name || !state.profiles.b.name;
    if(needsSetup){ renderSetup(); return; }
    if(!getRole()){ renderRolePick(); return; }
    renderMain();
  }

  function renderConfigError(){
    document.getElementById("app").innerHTML =
      '<div class="intro"><div class="big-emoji">🐒</div><h1>Humordômetro</h1></div>' +
      '<div class="config-error">' +
        '<h2>Faltou configurar</h2>' +
        '<p>Abre o arquivo <code>index.html</code> e troca <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> pelos valores do seu projeto Supabase (em Settings &gt; API), e cria a tabela com o SQL do README.</p>' +
      '</div>';
  }

  function renderLoadError(){
    document.getElementById("app").innerHTML =
      '<div class="intro"><div class="big-emoji">🐒</div><h1>Humordômetro</h1></div>' +
      '<div class="config-error">' +
        '<h2>Não consegui carregar</h2>' +
        '<p>Confere se a URL/chave do Supabase estão certas e se a tabela <code>casal_humor</code> existe (veja o README).</p>' +
      '</div>';
  }

  async function init(){
    document.getElementById("app").innerHTML = '<div class="loading">Carregando...</div>';

    if(!SUPABASE_URL || SUPABASE_URL.indexOf("COLE_AQUI") === 0 ||
       !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf("COLE_AQUI") === 0){
      renderConfigError();
      return;
    }

    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    try{
      await loadState();
    }catch(e){
      renderLoadError();
      return;
    }

    render();

    sb.channel(TABLE + "-live")
      .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, async function(){
        try{
          await loadState();
          render();
        }catch(e){ /* ignore transient reload errors */ }
      })
      .subscribe();
  }

  init();
})();
</script>
</body>
</html>
